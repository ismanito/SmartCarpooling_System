# RideMate on Render: Postgres (with PostGIS), the Express API, the Python matcher and the React site.
# Create it with "New > Blueprint" in Render, pick this repo, and fill in the values marked sync: false.
# Steps and the order to do them in are in docs/DEPLOY_RENDER.md.
databases:
  - name: ridemate-db
    plan: free
    postgresMajorVersion: '16'

services:
  # ---- API (free plan, for demos). Free services sleep after 15 minutes without traffic and have no
  # persistent disk, so uploaded driver documents are lost on restart. Move to a paid plan with a disk for real use.
  - type: web
    name: ridemate-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: node scripts/migrate.js && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_URL
        fromDatabase: { name: ridemate-db, property: connectionString }
      - key: PRIVATE_DOCS_DIR
        value: /tmp/private-docs
      - key: DOC_SIGNING_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        value: usiu.ac.ke
      - key: ADMIN_EMAILS
        value: 'ismahanabdijay@gmail.com'
      - key: SENIOR_ADMIN_EMAILS
        value: 'ismahanabdijay@gmail.com'
      - key: ALLOW_DRIVER_SIGNUP
        value: 'true'
      - key: DEMO_EMAIL_DOMAINS
        value: demo.ridemate.test # demo accounts only; clear this for real use
      - key: CORS_ORIGIN
        value: 'https://ridemate-web.onrender.com'
      - key: APP_URL
        value: 'https://ridemate-web.onrender.com'
      - key: FIREBASE_PROJECT_ID
        value: 'ridemate-demo-isa26'
      - key: FIREBASE_USE_EMULATOR
        value: 'false'
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json # add it as a Secret File in Render
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: MATCHER_URL
        fromService: { type: web, name: ridemate-matcher, property: hostport }
      - key: MATCHER_INTERNAL_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  # ---- Matcher
  - type: web
    name: ridemate-matcher
    runtime: python
    rootDir: matcher
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: ridemate-db, property: connectionString }
      - key: MATCHER_INTERNAL_KEY
        sync: false # paste the same value Render generated for ridemate-api

  # ---- Website (static). Calls the API directly, so the API's CORS_ORIGIN must be this site's URL.
  - type: web
    name: ridemate-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: 'https://ridemate-api-ooyp.onrender.com/api'
      - key: VITE_SOCKET_URL
        value: 'https://ridemate-api-ooyp.onrender.com'
      - key: VITE_FIREBASE_API_KEY
        value: 'AIzaSyCoIaEMsZ7-iWiQQA4d9evzGKcswm5kinQ'
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: 'ridemate-demo-isa26.firebaseapp.com'
      - key: VITE_FIREBASE_PROJECT_ID
        value: 'ridemate-demo-isa26'
      - key: VITE_FIREBASE_APP_ID
        value: '1:1013605811233:web:37141a594e37b2ca070f60'
      - key: VITE_FIREBASE_USE_EMULATOR
        value: 'false'
      - key: VITE_GOOGLE_MAPS_BROWSER_KEY
        sync: false
