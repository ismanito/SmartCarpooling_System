# Staging on Render: Postgres (with PostGIS), the Express API and the Python matcher.
# Create it with "New > Blueprint" in Render and fill in the values marked sync: false.
databases:
  - name: ridemate-db
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: ridemate-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    preDeployCommand: node scripts/migrate.js
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_URL
        fromDatabase: { name: ridemate-db, property: connectionString }
      - key: ALLOWED_EMAIL_DOMAINS
        value: usiu.ac.ke
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGIN
        sync: false # the Vercel URL, e.g. https://ridemate-staging.vercel.app
      - key: APP_URL
        sync: false # same Vercel URL
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_USE_EMULATOR
        value: 'false'
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json # add it as a Secret File in Render
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: MATCHER_URL
        fromService: { type: web, name: ridemate-matcher, property: hostport }
      - key: MATCHER_INTERNAL_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: ridemate-matcher
    runtime: python
    rootDir: matcher
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: ridemate-db, property: connectionString }
      - key: MATCHER_INTERNAL_KEY
        sync: false # paste the same value Render generated for the API
